name: Update Powerpuff calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
permissions:
  contents: write
concurrency:
  group: powerpuff-calendar
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate.py
      - name: Save calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/powerpuff-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Powerpuff contribution calendar'
            git push
          fi
